      <stop offset="0%" stop-color="#0A0E08"/><stop offset="100%" stop-color="#10170C"/>
    </linearGradient>
    <linearGradient id="sh-stats-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C6F24E"/><stop offset="100%" stop-color="#3ED6C5"/>
    </linearGradient>
    <pattern id="sh-stats-grid" width="36" height="36" patternUnits="userSpaceOnUse">
