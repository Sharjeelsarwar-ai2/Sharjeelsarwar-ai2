  <text x="36" y="72" font-family="monospace" font-size="16" fill="#C6F24E" letter-spacing="2">LIVE FROM THIS ACCOUNT  ·  NOT TYPED IN</text>
  <circle cx="1120" cy="46" r="22" fill="none" stroke="#3ED6C5" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="1120" cy="46" r="6" fill="#C6F24E"><animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/></circle>
